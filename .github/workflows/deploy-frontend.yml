name: Deploy compatible production cohort

on:
  workflow_run:
    workflows: [Verify]
    types: [completed]
    branches: [main]

concurrency:
  group: tincanban-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  packages: write

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      VERIFIED_RUN_ID: ${{ github.event.workflow_run.id }}
      VERIFIED_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      RUSTY_DEPLOY_SPEC: ${{ vars.RUSTY_DEPLOY_SPEC }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      DOCKER_REGISTRY_USERNAME: ${{ github.repository_owner }}
      RUSTY_TRUSTED_OWNER: ${{ secrets.RUSTY_TRUSTED_OWNER }}
      RUSTY_TELEMETRY_TOKEN: ${{ secrets.RUSTY_TELEMETRY_TOKEN }}
      CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Fetch the exact existing Rusty config from Tangled
        run: node scripts/fetch-rusty-deploy-config.mjs
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.7
      - name: Install the pinned Kamal release tool
        run: gem install kamal --version 2.10.1 --no-document
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/frontend/package-lock.json
      - run: npm ci --prefix workers/frontend
      - name: Select the exact successful Rusty image run
        id: rusty
        run: |
          revision=$(node scripts/release-coordinator.mjs rusty-revision)
          selected=$(gh api --method GET repos/bobishh/rusty/actions/workflows/ci.yml/runs -f head_sha="$revision" -f status=success -f event=push -f branch=main -f per_page=20 --jq '.workflow_runs[] | select(.head_repository.full_name == "bobishh/rusty" and .head_sha == "'"$revision"'") | "\(.id) \(.run_attempt)"' | head -n 1)
          read -r run_id attempt <<< "$selected"
          test -n "$run_id"
          test -n "$attempt"
          gh run download "$run_id" --repo bobishh/rusty --name "rusty-release-$revision-$attempt" --dir .release/rusty
          echo "RUSTY_RUN_ID=$run_id" >> "$GITHUB_ENV"
          echo "RUSTY_RUN_ATTEMPT=$attempt" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v7
        with:
          name: tincanban-frontend-cohort-${{ github.event.workflow_run.head_sha }}-${{ github.event.workflow_run.run_attempt }}
          path: .release/frontend/
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - uses: actions/download-artifact@v7
        with:
          name: tincanban-automation-cohort-${{ github.event.workflow_run.head_sha }}-${{ github.event.workflow_run.run_attempt }}
          path: .release/automation/
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Seal the compatible cohort and protected reader floors
        run: node scripts/release-coordinator.mjs prepare .release "$RELEASE_SHA"
      - name: Prepare the existing Rusty host transport
        env:
          RUSTY_DEPLOY_SSH_KEY: ${{ secrets.RUSTY_DEPLOY_SSH_KEY }}
          RUSTY_DEPLOY_KNOWN_HOSTS: ${{ secrets.RUSTY_DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$RUSTY_DEPLOY_SSH_KEY"
          test -n "$RUSTY_DEPLOY_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$RUSTY_DEPLOY_SSH_KEY" > "$RUNNER_TEMP/rusty-deploy-key"
          chmod 600 "$RUNNER_TEMP/rusty-deploy-key"
          printf '%s\n' "$RUSTY_DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          echo "RUSTY_SSH_KEY_FILE=$RUNNER_TEMP/rusty-deploy-key" >> "$GITHUB_ENV"
      - name: Prepare private Rusty runtime secrets for Kamal
        env:
          DEPLOY_CONFIG_DIR: .release-config/hetzner_playground
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RUSTY_TRUSTED_OWNER"
          test -n "$RUSTY_TELEMETRY_TOKEN"
          test -n "$CLICKHOUSE_PASSWORD"
          case "$RUSTY_TELEMETRY_TOKEN$CLICKHOUSE_PASSWORD" in *$'\n'*|*$'\r'*) exit 1;; esac
          install -m 700 -d "$DEPLOY_CONFIG_DIR/.kamal"
          umask 077
          printf 'RUSTY_TELEMETRY_TOKEN=%s\nCLICKHOUSE_PASSWORD=%s\n' "$RUSTY_TELEMETRY_TOKEN" "$CLICKHOUSE_PASSWORD" > "$DEPLOY_CONFIG_DIR/.kamal/secrets"
          chmod 600 "$DEPLOY_CONFIG_DIR/.kamal/secrets"
      - name: Stage immutable Worker versions without rebuilding
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          for component in automation frontend; do
            upload_output="$RUNNER_TEMP/$component-upload.jsonl"
            WRANGLER_OUTPUT_FILE_PATH="$upload_output" workers/frontend/node_modules/.bin/wrangler versions upload --config ".release/deploy/$component.json" --no-bundle --keep-vars --tag "$RELEASE_SHA"
            node scripts/release-coordinator.mjs record-version .release "$component" "$upload_output"
          done
      - uses: actions/upload-artifact@v6
        with:
          name: cohort-staged-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Require current main before any production activation
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          test "$current" = "$RELEASE_SHA"
      - name: Activate and confirm exact native image first
        run: node scripts/release-coordinator.mjs activate .release rusty
      - name: Activate and confirm exact automation version
        run: node scripts/release-coordinator.mjs activate .release automation
      - name: Activate frontend only after compatible servers confirm
        run: node scripts/release-coordinator.mjs activate .release frontend
      - name: Verify the whole active cohort and actual frontend bytes
        run: node scripts/release-coordinator.mjs complete .release
      - name: Preserve activation or interrupted-recovery evidence
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: cohort-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
