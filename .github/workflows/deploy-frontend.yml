name: Deploy tincanban frontend

on:
  workflow_run:
    workflows: [Verify]
    types: [completed]
    branches: [main]

concurrency:
  group: tincanban-frontend-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      VERIFIED_RUN_ID: ${{ github.event.workflow_run.id }}
      VERIFIED_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/frontend/package-lock.json
      - run: npm ci --prefix workers/frontend
      - name: Select artifact from the successful frontend producer execution
        id: artifact
        run: node scripts/select-release-artifact.mjs frontend "$GITHUB_REPOSITORY" "$VERIFIED_RUN_ID" "$VERIFIED_RUN_ATTEMPT" "$RELEASE_SHA"
      - uses: actions/download-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: .release/frontend/
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Verify artifact seal and prepare frontend-only deployment
        env:
          ARTIFACT_ATTEMPT: ${{ steps.artifact.outputs.attempt }}
        run: node scripts/component-release.mjs prepare frontend .release/frontend .release/deploy/frontend "$RELEASE_SHA" "$VERIFIED_RUN_ID" "$ARTIFACT_ATTEMPT"
      - name: Preserve active frontend reader floors
        run: node scripts/component-release.mjs compatibility frontend .release/frontend
      - name: Require current main before frontend activation
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$RELEASE_SHA"
      - name: Stage and activate this frontend version only
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          output="$RUNNER_TEMP/frontend-upload.jsonl"
          WRANGLER_OUTPUT_FILE_PATH="$output" workers/frontend/node_modules/.bin/wrangler versions upload --config .release/deploy/frontend/wrangler.json --no-bundle --keep-vars --tag "$RELEASE_SHA"
          version="$(node workers/frontend/release.mjs uploaded-version "$output")"
          echo "FRONTEND_VERSION=$version" >> "$GITHUB_ENV"
          printf '%s\n' "$version" > .release/deploy/frontend/provider-version.txt
          workers/frontend/node_modules/.bin/wrangler versions deploy --config .release/deploy/frontend/wrangler.json "$version@100" --yes
      - name: Confirm frontend release metadata and published bytes
        run: node scripts/component-release.mjs verify .release/deploy/frontend/expected.json "$FRONTEND_VERSION"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: frontend-deployment-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 90
