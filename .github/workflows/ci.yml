name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Direct pushes often arrive in bursts while an agent is iterating. Keep only
# the newest run for a branch instead of billing every obsolete commit.
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUSTY_REVISION: a7b39d11c377d86c0ea4ded13ef28edaf877c16b

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:meta-mesh
      - name: Verify Ubuntu mirror rewrite fixtures
        run: bash scripts/use-primary-ubuntu-mirror.test.sh
      - name: Verify Match receive mutation contract
        run: MATCH_ROOT="$GITHUB_WORKSPACE" python3 vendor/meta-mesh/formal/check_match_mutations.py
      - run: npm run verify:policy
      - run: npm run quality
      - name: Verify independent replica import boundaries
        if: ${{ !cancelled() }}
        run: npm run quality:replica
      - run: npm run test:coverage
        if: ${{ !cancelled() }}
      - name: Verify frontend deployment adapter
        run: node --test workers/frontend/*.test.mjs
      - name: Install pinned frontend Wrangler for package regression
        run: npm ci --prefix workers/frontend
      - name: Verify cohort artifact and deployment contracts
        run: node --test scripts/release-cohort.test.mjs scripts/component-release.test.mjs scripts/select-release-artifact.test.mjs scripts/automation-secrets.test.mjs
      - name: Build checked production frontend
        env:
          RELEASE_CANDIDATE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          VITE_PUBLIC_BOARD_ORIGIN: ${{ vars.VITE_PUBLIC_BOARD_ORIGIN }}
          VITE_IDENTITY_ORIGIN: ${{ vars.VITE_IDENTITY_ORIGIN || '' }}
          VITE_SYNC_TELEMETRY_URL: ${{ vars.VITE_SYNC_TELEMETRY_URL }}
          VITE_OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.VITE_OTEL_EXPORTER_OTLP_ENDPOINT }}
          VITE_SYNC_TELEMETRY_PROJECT: ${{ vars.VITE_SYNC_TELEMETRY_PROJECT || 'tincanban' }}
          VITE_SYNC_TELEMETRY_BROWSER_KEY: ${{ vars.VITE_SYNC_TELEMETRY_BROWSER_KEY }}
          VITE_SYNC_TELEMETRY_LEVEL: ${{ vars.VITE_SYNC_TELEMETRY_LEVEL || 'all' }}
          VITE_SYNC_TELEMETRY_SAMPLE_RATE: ${{ vars.VITE_SYNC_TELEMETRY_SAMPLE_RATE || '1' }}
          VITE_SYNC_TELEMETRY_BATCH_SIZE: ${{ vars.VITE_SYNC_TELEMETRY_BATCH_SIZE || '50' }}
          VITE_STARTUP_DIAGNOSTICS: ${{ vars.VITE_STARTUP_DIAGNOSTICS || '0' }}
        run: npm run quality:size
      - run: npm audit --audit-level=moderate
      - name: Seal checked build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RELEASE_CANDIDATE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          node workers/frontend/release.mjs seal "$GITHUB_SHA"
          node workers/frontend/release.mjs retain "$GITHUB_SHA"
          node scripts/capture-release-artifact.mjs frontend .release/frontend
      - uses: actions/upload-artifact@v6
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: tincanban-frontend-cohort-${{ github.sha }}-${{ github.run_attempt }}
          path: .release/frontend/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  formal-models:
    name: Tincanban formal models
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install pinned TLC
        env:
          TLC_SHA256: 936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88
        run: |
          jar="$RUNNER_TEMP/tla2tools-1.7.4.jar"
          curl -fL https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar -o "$jar"
          printf '%s  %s\n' "$TLC_SHA256" "$jar" | sha256sum --check --status
          java -version
      - name: Check Match TLA+ scenarios
        env:
          TLC_JAR: ${{ runner.temp }}/tla2tools-1.7.4.jar
          TLC_LOGS: ${{ runner.temp }}/match-tlc
        run: python3 verification/tla/run_models.py --logs "$TLC_LOGS"
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: tincanban-tlc-${{ github.sha }}
          path: ${{ runner.temp }}/match-tlc/
          if-no-files-found: ignore
          retention-days: 1

  browser-core:
    name: Browser (core ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    # Keep enough time for a complete behavioral shard and its configured retry.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/4", "2/4", "3/4", "4/4"]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:meta-mesh
      - name: Use Ubuntu primary archive mirror for Chromium dependencies
        run: bash scripts/use-primary-ubuntu-mirror.sh
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --reporter=list --project=core --shard=${{ matrix.shard }}
      - name: Verify deployment-configured diagnostics
        if: matrix.shard == '1/4'
        run: npx playwright test --reporter=list --config=playwright.telemetry.config.ts telemetry.spec.ts
      - uses: actions/upload-artifact@v6
        if: failure() || cancelled()
        with:
          name: core-failure-${{ strategy.job-index }}
          path: test-results/
          retention-days: 1

  browser-network:
    name: Browser (network ${{ matrix.group }})
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ startsWith(matrix.group, 'durable') && 20 || 25 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: durable-1
            projects: durable-mesh
            shard: 1/2
          - group: durable-2
            projects: durable-mesh
            shard: 2/2
          - group: replication
            projects: chat sync workspace-sync-data workspace-schema-migration scoped-sync scoped-enrollment
          - group: authority
            projects: scoped-delegated-owner member-access workspace-roles scoped-existing-board scoped-existing-identity succession-named succession-quorum
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:meta-mesh
      - name: Use Ubuntu primary archive mirror for Chromium dependencies
        run: bash scripts/use-primary-ubuntu-mirror.sh
      - run: npx playwright install --with-deps chromium
      - name: Verify network projects in separate browser processes
        env:
          PROJECTS: ${{ matrix.projects }}
          DURABLE_SHARD: ${{ matrix.shard }}
        run: |
          status=0
          for project in $PROJECTS; do
            if [ "$project" = chat ]; then
              npx playwright test --reporter=list --config=playwright.telemetry.config.ts --grep 'Given paired workspaces' --output="test-results/$project" || status=1
            elif [ "$project" = durable-mesh ]; then
              npx playwright test --reporter=list --project="$project" --fully-parallel --workers=1 --shard="$DURABLE_SHARD" --output="test-results/$project" || status=1
            else
              npx playwright test --reporter=list --project="$project" --output="test-results/$project" || status=1
            fi
          done
          exit "$status"
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: browser-network-${{ matrix.group }}-failure
          path: test-results/
          retention-days: 1

  browser-policy:
    name: Browser (production policy/transport packaging)
    # Private WebKit startup requires native Ed25519; Linux WebKit intermittently rejects it.
    runs-on: macos-15-intel
    # Production packaging, mobile behavior and startup use their real browsers.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:meta-mesh
      - name: Use Ubuntu primary archive mirror for browser dependencies
        if: runner.os == 'Linux'
        run: bash scripts/use-primary-ubuntu-mirror.sh
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e:policy
      - run: npx playwright test --reporter=list --project=mobile-webkit
      - run: npx playwright test --reporter=list --project=mobile-profile-sync
      - run: npx playwright test --reporter=list --config=playwright.startup.config.ts
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: policy-packaging-failure
          path: test-results/
          retention-days: 1

  browser-native:
    name: Browser (native Rust peer)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:meta-mesh
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            vendor/meta-mesh -> target
            crates/tincanban-lighthouse -> target
      - name: Use Ubuntu primary archive mirror for Chromium dependencies
        run: bash scripts/use-primary-ubuntu-mirror.sh
      - run: npx playwright install --with-deps chromium
      - name: Verify Rust protocol rules
        run: cargo test --locked --manifest-path vendor/meta-mesh/crates/meta-mesh-core/Cargo.toml --lib
      - run: cargo build --locked --manifest-path vendor/meta-mesh/crates/meta-mesh-native/Cargo.toml --example browser_document_probe
      - run: npx playwright test --reporter=list --project=browser-native
      - run: cargo build --locked --manifest-path crates/tincanban-lighthouse/Cargo.toml
      - run: npx playwright test --reporter=list --project=keeper-join
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: browser-native-failure
          path: test-results/
          retention-days: 1

  native-management:
    name: Native Rusty management and archive interoperability
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/checkout@v7
        with:
          repository: bobishh/rusty
          ref: ${{ env.RUSTY_REVISION }}
          path: .ci/rusty
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:meta-mesh
      - uses: dtolnay/rust-toolchain@stable
      - name: Move Rusty outside the application Cargo workspace
        run: cp -a "$GITHUB_WORKSPACE/.ci/rusty" "$RUNNER_TEMP/tincanban-rusty"
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            ${{ runner.temp }}/tincanban-rusty -> target
            vendor/meta-mesh -> target
      - name: Build pinned Rusty and the Native archive verifier
        run: |
          cargo build --locked --manifest-path "$RUNNER_TEMP/tincanban-rusty/Cargo.toml" --bin mesh-lighthouse
          cargo build --locked --manifest-path vendor/meta-mesh/Cargo.toml -p meta-mesh-core --example history_archive_verify
      - name: Fetch the exact previously deployed reader artifacts
        run: |
          git fetch --no-tags --depth=1 origin 07242d4880821829026234ca1a3cb6bd07ee29fe
          git -C vendor/meta-mesh fetch --no-tags --depth=1 origin 111943361d2c765557da00bbc568596ff1a5d047
      - name: Verify actual clients against restarted Native storage and policy
        env:
          TINCANBAN_RUSTY_BINARY: ${{ runner.temp }}/tincanban-rusty/target/debug/mesh-lighthouse
          TINCANBAN_HISTORY_VERIFY_BINARY: ${{ github.workspace }}/vendor/meta-mesh/target/debug/examples/history_archive_verify
          TINCANBAN_PRIOR_READER_PROBE: "1"
        run: npm run test:rusty-management

  automation-worker:
    name: Automation (intake, participant and owner lifecycle)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/checkout@v7
        with:
          repository: bobishh/rusty
          ref: ${{ env.RUSTY_REVISION }}
          path: .ci/rusty
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - name: Move Rusty outside the application Cargo workspace
        run: cp -a "$GITHUB_WORKSPACE/.ci/rusty" "$RUNNER_TEMP/tincanban-rusty"
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: ${{ runner.temp }}/tincanban-rusty -> target
      - name: Build pinned blind Rusty
        run: cargo build --locked --manifest-path "$RUNNER_TEMP/tincanban-rusty/Cargo.toml"
      - name: Verify public publication protocol and storage
        run: cargo test --locked --manifest-path "$RUNNER_TEMP/tincanban-rusty/Cargo.toml"
      - name: Install locked Worker dependencies
        run: |
          npm install --global pnpm@11.25.0
          pnpm --dir workers/automation install --frozen-lockfile
      - name: Check Worker contract and real runtime
        working-directory: workers/automation
        run: |
          npm run check
          npm test
          npm run build -- --outdir .artifact
      - name: Verify headless participant runtime
        run: |
          node services/reaction-runtime/build.mjs
          node services/reaction-runtime/dist/run-tests.mjs
      - name: Capture the checked immutable Worker bundle
        env:
          RELEASE_CANDIDATE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/capture-release-artifact.mjs automation .release/automation
      - name: Verify the captured Worker artifact in the real runtime
        working-directory: workers/automation
        env:
          TINCANBAN_AUTOMATION_RUNTIME_CONFIG: ../../.release/automation/wrangler.json
        run: npm run test:runtime
      - uses: actions/upload-artifact@v6
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: tincanban-automation-cohort-${{ github.sha }}-${{ github.run_attempt }}
          path: .release/automation/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Use Ubuntu primary archive mirror for Chromium dependencies
        run: bash scripts/use-primary-ubuntu-mirror.sh
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Verify browser owner controls and scoped intake
        env:
          TINCANBAN_RUSTY_BINARY: ${{ runner.temp }}/tincanban-rusty/target/debug/mesh-lighthouse
        run: npx playwright test --config playwright.automation-worker.config.ts --reporter=list
      - name: Check out pinned Identity portal for shared Rusty acceptance
        uses: actions/checkout@v7
        with:
          repository: bobishh/identity
          ref: 1829ede0a2ebd27532e8e9ccfee8ec09638bc69c
          path: .ci/identity-provider
          ssh-key: ${{ secrets.IDENTITY_DEPLOY_KEY }}
          submodules: recursive
          persist-credentials: false
      - name: Install pinned Identity portal dependencies
        run: npm ci --prefix .ci/identity-provider
      - name: Verify encrypted storage connection
        env:
          TINCANBAN_RUSTY_BINARY: ${{ runner.temp }}/tincanban-rusty/target/debug/mesh-lighthouse
          IDENTITY_E2E_ORIGIN: http://127.0.0.1:4175
          IDENTITY_E2E_PROVIDER_DIR: ${{ github.workspace }}/.ci/identity-provider
        run: npx playwright test --config playwright.rusty.config.ts --reporter=list
      - name: Verify retained owner board reconnect
        env:
          TINCANBAN_RUSTY_BINARY: ${{ runner.temp }}/tincanban-rusty/target/debug/mesh-lighthouse
        run: npx playwright test --project=owner-reconnect --reporter=list --output=test-results/owner-reconnect
      - name: Verify Identity redirect trace continuity
        env:
          IDENTITY_E2E_ORIGIN: http://127.0.0.1:4175
          IDENTITY_E2E_PROVIDER_DIR: ${{ github.workspace }}/.ci/identity-provider
        run: npx playwright test --config playwright.identity-trace.config.ts --reporter=list
      - name: Verify ordinary phone sign-in and local board adoption
        env:
          TINCANBAN_RUSTY_BINARY: ${{ runner.temp }}/tincanban-rusty/target/debug/mesh-lighthouse
          IDENTITY_E2E_ORIGIN: http://127.0.0.1:4175
          IDENTITY_E2E_PROVIDER_DIR: ${{ github.workspace }}/.ci/identity-provider
        run: npx playwright test --config playwright.identity-bootstrap.config.ts --reporter=list
      - name: Verify cold Identity catalog discovery with source closed
        env:
          TINCANBAN_RUSTY_BINARY: ${{ runner.temp }}/tincanban-rusty/target/debug/mesh-lighthouse
          IDENTITY_E2E_ORIGIN: http://127.0.0.1:4175
          IDENTITY_E2E_PROVIDER_DIR: ${{ github.workspace }}/.ci/identity-provider
        run: npx playwright test --config playwright.identity-cold-catalog.config.ts --reporter=list
      - name: Verify public board lifecycle with native storage
        env:
          TINCANBAN_RUSTY_BINARY: ${{ runner.temp }}/tincanban-rusty/target/debug/mesh-lighthouse
        run: npm run test:e2e:public-board -- --project=chromium
      - name: Verify compiled anonymous reader
        env:
          TINCANBAN_RUSTY_BINARY: ${{ runner.temp }}/tincanban-rusty/target/debug/mesh-lighthouse
          TINCANBAN_PUBLIC_E2E_PREVIEW: "1"
        run: npm run test:e2e:public-board
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: automation-worker-failure
          path: |
            test-results-automation-worker/
            test-results-identity-bootstrap/
            test-results-identity-cold-catalog/
            test-results/
          retention-days: 1

  browser-archives:
    name: Browser (archives and attachments ${{ matrix.group }})
    # Cross-device WebKit needs macOS WebRTC; build Rusty once per platform.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: chromium
            os: ubuntu-24.04
            browser: chromium
            projects: attachments-rusty attachment-session-recovery complete-device-state
          - group: webkit
            os: macos-15-intel
            browser: webkit
            projects: attachments-rusty-webkit attachment-session-recovery-webkit
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/checkout@v7
        with:
          repository: bobishh/rusty
          ref: ${{ env.RUSTY_REVISION }}
          path: .ci/rusty
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:meta-mesh
      - uses: dtolnay/rust-toolchain@stable
      - name: Move Rusty outside the application Cargo workspace
        run: cp -a "$GITHUB_WORKSPACE/.ci/rusty" "$RUNNER_TEMP/tincanban-rusty"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ runner.temp }}/tincanban-rusty -> target
      - name: Build the pinned blind storage service
        run: cargo build --locked --manifest-path "$RUNNER_TEMP/tincanban-rusty/Cargo.toml" --bin mesh-lighthouse
      - name: Use Ubuntu primary archive mirror for browser dependencies
        if: runner.os == 'Linux'
        run: bash scripts/use-primary-ubuntu-mirror.sh
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Verify archive recovery and attachment lifecycle
        env:
          TINCANBAN_RUSTY_BINARY: ${{ runner.temp }}/tincanban-rusty/target/debug/mesh-lighthouse
          PROJECTS: ${{ matrix.projects }}
        run: |
          status=0
          for project in $PROJECTS; do
            npx playwright test --reporter=list --project="$project" --output="test-results/$project" || status=1
          done
          exit "$status"
      - name: Verify mobile Rusty credential recovery in WebKit
        if: matrix.browser == 'webkit'
        env:
          TINCANBAN_RUSTY_BINARY: ${{ runner.temp }}/tincanban-rusty/target/debug/mesh-lighthouse
        run: npx playwright test --config playwright.rusty.config.ts rusty-credential-conflict.spec.ts --reporter=list --output=test-results/rusty-credential-recovery-webkit
      - name: Verify public board lifecycle in WebKit with native Ed25519
        if: matrix.browser == 'webkit'
        env:
          TINCANBAN_RUSTY_BINARY: ${{ runner.temp }}/tincanban-rusty/target/debug/mesh-lighthouse
        run: npm run test:e2e:public-board -- --project=webkit
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: archives-${{ matrix.group }}-failure
          path: test-results/
          retention-days: 1
