name: Deploy tincanban automation

on:
  workflow_run:
    workflows: [Verify]
    types: [completed]
    branches: [main]

concurrency:
  group: tincanban-automation-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      VERIFIED_RUN_ID: ${{ github.event.workflow_run.id }}
      VERIFIED_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AUTOMATION_TELEMETRY_TOKEN: ${{ secrets.AUTOMATION_TELEMETRY_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/frontend/package-lock.json
      - run: npm ci --prefix workers/frontend
      - uses: actions/download-artifact@v7
        with:
          name: tincanban-automation-cohort-${{ github.event.workflow_run.head_sha }}-${{ github.event.workflow_run.run_attempt }}
          path: .release/automation/
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Verify artifact seal and prepare automation-only deployment
        run: node scripts/component-release.mjs prepare automation .release/automation .release/deploy/automation "$RELEASE_SHA" "$VERIFIED_RUN_ID" "$VERIFIED_RUN_ATTEMPT"
      - name: Preserve active automation reader floors
        run: node scripts/component-release.mjs compatibility automation .release/automation
      - name: Require current main before automation activation
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$RELEASE_SHA"
      - name: Stage and activate this automation version only
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          secret_args=()
          telemetry_secrets="$RUNNER_TEMP/automation-telemetry-secrets.json"
          trap 'rm -f "$telemetry_secrets"' EXIT
          if [ -n "$AUTOMATION_TELEMETRY_TOKEN" ]; then
            AUTOMATION_SECRETS_FILE="$telemetry_secrets" node --input-type=module -e 'import { writeFileSync } from "node:fs"; writeFileSync(process.env.AUTOMATION_SECRETS_FILE, JSON.stringify({ TELEMETRY_TOKEN: process.env.AUTOMATION_TELEMETRY_TOKEN }), { mode: 0o600 });'
            secret_args=(--secrets-file "$telemetry_secrets")
          fi
          output="$RUNNER_TEMP/automation-upload.jsonl"
          WRANGLER_OUTPUT_FILE_PATH="$output" workers/frontend/node_modules/.bin/wrangler versions upload --config .release/deploy/automation/wrangler.json --no-bundle --keep-vars --tag "$RELEASE_SHA" "${secret_args[@]}"
          version="$(node workers/frontend/release.mjs uploaded-version "$output")"
          echo "AUTOMATION_VERSION=$version" >> "$GITHUB_ENV"
          workers/frontend/node_modules/.bin/wrangler versions deploy --config .release/deploy/automation/wrangler.json "$version@100" --yes --durable-objects-code-update-mode immediate
      - name: Confirm automation artifact and active reader floors
        run: node scripts/component-release.mjs verify .release/deploy/automation/expected.json "$AUTOMATION_VERSION"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: automation-deployment-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 90
