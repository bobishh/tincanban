name: Deploy tincanban automation

on:
  workflow_run:
    workflows: [Verify]
    types: [completed]
    branches: [main]

concurrency:
  group: tincanban-automation-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      VERIFIED_RUN_ID: ${{ github.event.workflow_run.id }}
      VERIFIED_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AUTOMATION_TELEMETRY_TOKEN: ${{ secrets.AUTOMATION_TELEMETRY_TOKEN }}
      AUTOMATION_REFLUX_SERVICE_TOKEN: ${{ secrets.AUTOMATION_REFLUX_SERVICE_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/frontend/package-lock.json
      - run: npm ci --prefix workers/frontend
      - name: Select artifact from the successful automation producer execution
        id: artifact
        run: node scripts/select-release-artifact.mjs automation "$GITHUB_REPOSITORY" "$VERIFIED_RUN_ID" "$VERIFIED_RUN_ATTEMPT" "$RELEASE_SHA"
      - uses: actions/download-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: .release/automation/
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Verify artifact seal and prepare automation-only deployment
        env:
          ARTIFACT_ATTEMPT: ${{ steps.artifact.outputs.attempt }}
        run: node scripts/component-release.mjs prepare automation .release/automation .release/deploy/automation "$RELEASE_SHA" "$VERIFIED_RUN_ID" "$ARTIFACT_ATTEMPT"
      - name: Preserve active automation reader floors
        run: node scripts/component-release.mjs compatibility automation .release/automation
      - name: Require current main before automation activation
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$RELEASE_SHA"
      - name: Require imported Reflux participant before HTTP cutover
        run: |
          test -n "$AUTOMATION_REFLUX_SERVICE_TOKEN"
          curl --fail --silent --show-error --output /dev/null --retry 120 --retry-delay 5 --retry-all-errors --max-time 60 --retry-max-time 900 \
            --header "Authorization: Bearer $AUTOMATION_REFLUX_SERVICE_TOKEN" \
            --header "x-tincanban-public-origin: https://automation.meta-uber-engineer.dev" \
            https://reflux.meta-uber-engineer.dev/internal/tincanban/v2/capabilities
      - name: Stage and activate this automation version only
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          secret_args=()
          automation_secrets="$RUNNER_TEMP/automation-secrets.json"
          trap 'rm -f "$automation_secrets"' EXIT
          node scripts/automation-secrets.mjs "$automation_secrets"
          if [ -f "$automation_secrets" ]; then secret_args=(--secrets-file "$automation_secrets"); fi
          output="$RUNNER_TEMP/automation-upload.jsonl"
          WRANGLER_OUTPUT_FILE_PATH="$output" workers/frontend/node_modules/.bin/wrangler versions upload --config .release/deploy/automation/wrangler.json --no-bundle --keep-vars --tag "$RELEASE_SHA" "${secret_args[@]}"
          version="$(node workers/frontend/release.mjs uploaded-version "$output")"
          echo "AUTOMATION_VERSION=$version" >> "$GITHUB_ENV"
          workers/frontend/node_modules/.bin/wrangler versions deploy --config .release/deploy/automation/wrangler.json "$version@100" --yes --durable-objects-code-update-mode immediate
      - name: Confirm automation artifact and active reader floors
        run: node scripts/component-release.mjs verify .release/deploy/automation/expected.json "$AUTOMATION_VERSION"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: automation-deployment-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 90
