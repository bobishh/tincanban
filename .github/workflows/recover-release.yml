name: Recover one tincanban component

on:
  workflow_dispatch:
    inputs:
      component:
        description: Component to restore from a successful main Verify run
        type: choice
        options: [frontend, automation]
        required: true
      source_run:
        description: Exact successful Verify run ID containing the sealed artifact
        required: true
        type: string
      source_attempt:
        description: Exact attempt of that Verify run
        required: true
        type: string
      current_deployment_run:
        description: Exact currently active frontend deploy/recovery run ID (frontend only)
        required: false
        type: string
      current_deployment_attempt:
        description: Exact attempt of the currently active frontend deploy/recovery run
        required: false
        type: string

concurrency:
  group: tincanban-${{ inputs.component }}-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  recover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    env:
      COMPONENT: ${{ inputs.component }}
      SOURCE_RUN: ${{ inputs.source_run }}
      SOURCE_ATTEMPT: ${{ inputs.source_attempt }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AUTOMATION_TELEMETRY_TOKEN: ${{ secrets.AUTOMATION_TELEMETRY_TOKEN }}
      AUTOMATION_EXECUTOR_SERVICE_TOKEN: ${{ secrets.AUTOMATION_EXECUTOR_SERVICE_TOKEN }}
      AUTOMATION_EXECUTOR_MIGRATION_SECRET: ${{ secrets.AUTOMATION_EXECUTOR_MIGRATION_SECRET }}
      AUTOMATION_CLASSIFICATION_SERVICE_TOKEN: ${{ secrets.AUTOMATION_CLASSIFICATION_SERVICE_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/frontend/package-lock.json
      - run: npm ci --prefix workers/frontend
      - name: Require exact successful main Verify run
        id: source
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN" =~ ^[1-9][0-9]*$ && "$SOURCE_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/attempts/$SOURCE_ATTEMPT")"
          jq -e --arg repo "$GITHUB_REPOSITORY" '.head_branch == "main" and .event == "push" and .conclusion == "success" and .run_attempt == ($ENV.SOURCE_ATTEMPT|tonumber) and .repository.full_name == $repo and .head_repository.full_name == $repo and .path == ".github/workflows/ci.yml"' <<<"$run" >/dev/null
          sha="$(jq -r .head_sha <<<"$run")"
          echo "RELEASE_SHA=$sha" >> "$GITHUB_ENV"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Require current frontend deployment evidence for frontend rollback
        if: inputs.component == 'frontend'
        env:
          CURRENT_RUN: ${{ inputs.current_deployment_run }}
          CURRENT_ATTEMPT: ${{ inputs.current_deployment_attempt }}
        run: |
          set -euo pipefail
          [[ "$CURRENT_RUN" =~ ^[1-9][0-9]*$ && "$CURRENT_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CURRENT_RUN/attempts/$CURRENT_ATTEMPT")"
          jq -e --arg repo "$GITHUB_REPOSITORY" '.head_branch == "main" and (.event == "workflow_run" or .event == "workflow_dispatch") and .conclusion == "success" and .run_attempt == ($ENV.CURRENT_ATTEMPT|tonumber) and .repository.full_name == $repo and .head_repository.full_name == $repo and (.path == ".github/workflows/deploy-frontend.yml" or .path == ".github/workflows/recover-release.yml")' <<<"$run" >/dev/null
      - uses: actions/download-artifact@v7
        if: inputs.component == 'frontend'
        with:
          name: frontend-deployment-${{ inputs.current_deployment_run }}-${{ inputs.current_deployment_attempt }}
          path: .recovery/current/
          github-token: ${{ github.token }}
          run-id: ${{ inputs.current_deployment_run }}
      - uses: actions/download-artifact@v7
        with:
          name: tincanban-${{ inputs.component }}-cohort-${{ steps.source.outputs.sha }}-${{ inputs.source_attempt }}
          path: .release/${{ inputs.component }}/
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run }}
      - name: Confirm selected frontend is currently active before preserving its chunks
        if: inputs.component == 'frontend'
        run: node scripts/component-release.mjs verify .recovery/current/deploy/frontend/expected.json "$(cat .recovery/current/deploy/frontend/provider-version.txt)"
      - name: Verify selected component artifact and prepare isolated deployment
        run: |
          if [ "$COMPONENT" = frontend ]; then
            node scripts/component-release.mjs compose-frontend-rollback .release/frontend .recovery/current/frontend .release/frontend-rollback
            rm -rf .release/frontend
            mv .release/frontend-rollback .release/frontend
            node scripts/component-release.mjs prepare frontend .release/frontend .release/deploy/frontend "$RELEASE_SHA" "$SOURCE_RUN" "$SOURCE_ATTEMPT"
          else
            node scripts/component-release.mjs prepare automation .release/automation .release/deploy/automation "$RELEASE_SHA" "$SOURCE_RUN" "$SOURCE_ATTEMPT"
          fi
      - name: Preserve active component reader floors
        run: |
          node scripts/component-release.mjs compatibility "$COMPONENT" ".release/$COMPONENT"
      - name: Stage and activate the selected component only
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          secret_args=()
          automation_secrets="$RUNNER_TEMP/automation-secrets.json"
          trap 'rm -f "$automation_secrets"' EXIT
          if [ "$COMPONENT" = automation ]; then
            node scripts/automation-secrets.mjs "$automation_secrets"
            if [ -f "$automation_secrets" ]; then secret_args=(--secrets-file "$automation_secrets"); fi
          fi
          output="$RUNNER_TEMP/$COMPONENT-upload.jsonl"
          config=".release/deploy/$COMPONENT/wrangler.json"
          WRANGLER_OUTPUT_FILE_PATH="$output" workers/frontend/node_modules/.bin/wrangler versions upload --config "$config" --no-bundle --keep-vars --tag "$RELEASE_SHA" "${secret_args[@]}"
          version="$(node workers/frontend/release.mjs uploaded-version "$output")"
          echo "COMPONENT_VERSION=$version" >> "$GITHUB_ENV"
          printf '%s\n' "$version" > ".release/deploy/$COMPONENT/provider-version.txt"
          deploy_args=()
          if [ "$COMPONENT" = automation ]; then deploy_args+=(--durable-objects-code-update-mode immediate); fi
          workers/frontend/node_modules/.bin/wrangler versions deploy --config "$config" "$version@100" --yes "${deploy_args[@]}"
      - name: Confirm selected component and frontend bytes
        run: node scripts/component-release.mjs verify ".release/deploy/$COMPONENT/expected.json" "$COMPONENT_VERSION"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ${{ inputs.component }}-deployment-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 90
