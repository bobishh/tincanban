[package]
name = "tincanban-keeper"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
tincanban-authority = { path = "../tincanban-authority" }
meta-mesh-core = { path = "../../vendor/meta-mesh/crates/meta-mesh-core" }
meta-mesh-native = { path = "../../vendor/meta-mesh/crates/meta-mesh-native" }
automerge = "0.12"
base64 = "0.22"
iroh = "1.2.0"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1", features = ["full"] }

[patch."https://github.com/bobishh/meta-mesh.git"]
meta-mesh-core = { path = "../../vendor/meta-mesh/crates/meta-mesh-core" }
