<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f0e8" />
    <title>tincanban</title>
    <link rel="preload" href="/assets/caveat-latin-wght.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" href="/favicon.png?v=8" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon.svg?v=9" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=8" />
    <style>
      .startup-screen { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; background: #f3f0e8; color: #6b675f; font: 600 18px/1.4 system-ui, sans-serif; }
      /* Shared by the HTML placeholder and Vue status at every startup stage. */
      .startup-status-mark { display: inline-flex; flex: 0 0 auto; align-items: center; justify-content: center; gap: 4px; min-width: 26px; min-height: 20px; color: var(--blue, #1f6feb); border: 0; border-image: none !important; }
      .startup-status-dot { display: block; width: 6px; height: 6px; background: currentColor; border: 0; border-image: none !important; border-radius: 50%; animation: startup-dot-one 1.8s steps(1, end) infinite; }
      .startup-status-dot:nth-child(2) { animation-name: startup-dot-two; }
      .startup-status-dot:nth-child(3) { animation-name: startup-dot-three; }
      @keyframes startup-dot-one { 0% { opacity: 1; } 75%, 100% { opacity: 0; } }
      @keyframes startup-dot-two { 0%, 75%, 100% { opacity: 0; } 25% { opacity: 1; } }
      @keyframes startup-dot-three { 0%, 75%, 100% { opacity: 0; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .startup-status-dot { animation: none; } }
    </style>
  </head>
  <body>
    <div id="app"><div class="boot-placeholder startup-screen" role="status" aria-label="Board status"><span class="startup-status-mark" aria-hidden="true"><span class="startup-status-dot"></span><span class="startup-status-dot"></span><span class="startup-status-dot"></span></span><span>Starting local checks…</span></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
